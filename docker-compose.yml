# Levanta los 3 contenedores de ingesta en la VM de ingesta. Cada uno hace pull
# del 100% de los registros de su base y sube el resultado a su carpeta del
# bucket S3.
#
# Para el avance del 50% basta con levantar SOLO ingesta01:
#     docker compose up --build ingesta01
services:
  ingesta01:
    build: ./ingesta01
    container_name: ingesta01-residentes-postgres
    env_file: .env
    restart: "no"

  ingesta02:
    build: ./ingesta02
    container_name: ingesta02-pagos-mysql
    env_file: .env
    restart: "no"

  ingesta03:
    build: ./ingesta03
    container_name: ingesta03-incidencias-mongo
    env_file: .env
    restart: "no"
